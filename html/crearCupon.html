<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="../css/components.css">
  <script src="../js/components.js"></script>
  <title>Crear / Editar Cupón</title>
</head>
<body class="d-flex flex-column min-vh-100">
  <section class="image-background" style="--bg-url: url('../assets/img/imagenDesarrolladoresWeb.PNG')">
    <section id="navbarAdmin"></section>
    <main class="container py-5 flex-grow-1">
      <div class="row justify-content-center">
        <div class="col-md-8">
          <div class="form-card">
            <div class="form-header">Crear Cupón</div>
            <form id="cuponForm" class="custom-form">
      <div class="mb-3">
        <label for="codigo" class="form-label">Código</label>
        <input type="text" id="codigo" class="form-control" required>
      </div>
      <div class="mb-3">
        <label for="descripcion" class="form-label">Descripción</label>
        <input type="text" id="descripcion" class="form-control">
      </div>
      <div class="row">
        <div class="col-md-4 mb-3">
          <label for="descuento" class="form-label">Descuento</label>
          <input type="number" id="descuento" class="form-control" step="0.01" required>
        </div>
        <div class="col-md-4 mb-3">
          <label for="tipo" class="form-label">Tipo</label>
          <select id="tipo" class="form-select" required>
            <option value="porcentaje">Porcentaje</option>
            <option value="monto">Monto</option>
          </select>
        </div>
        <div class="col-md-4 mb-3">
          <label for="usosMaximos" class="form-label">Usos máximos</label>
          <input type="number" id="usosMaximos" class="form-control">
        </div>
      </div>
      <div class="row">
        <div class="col-md-6 mb-3">
          <label for="inicio" class="form-label">Fecha inicio</label>
          <input type="date" id="inicio" class="form-control">
        </div>
        <div class="col-md-6 mb-3">
          <label for="fin" class="form-label">Fecha fin</label>
          <input type="date" id="fin" class="form-control">
        </div>
      </div>
      <div class="d-flex justify-content-between">
        <button type="submit" class="btn btn-primary">Guardar</button>
        <button type="button" id="btnEliminar" class="btn btn-danger">Eliminar cupón</button>
      </div>
            </form>
          </div>
        </div>
      </div>
    </main>
  </section>
  <section id="footer"></section>
  <script src="../js/apiConfig.js"></script>
  <script src="../js/cuponForm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
