<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editar Usuario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <link rel="stylesheet" href="../css/editProduct.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="icon" sizes="64x64" href="/assets/img/2.png" />
  <script src="../js/components.js"></script>
</head>
<body>
  <section id="navbarAdmin"></section>
  <div class="container my-5">
    <div class="form-wrapper">
      <h2 class="form-title mb-4">Editar Usuario</h2>
      <form id="editUserForm" class="needs-validation" novalidate>
        <div class="mb-3">
          <label for="nombre" class="form-label">Nombre</label>
          <input type="text" id="nombre" class="form-control" required>
        </div>
        <div class="mb-3">
          <label for="apellido" class="form-label">Apellido</label>
          <input type="text" id="apellido" class="form-control" required>
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Correo electrónico</label>
          <input type="email" id="email" class="form-control" required>
        </div>
        <div class="mb-3">
          <label for="rol" class="form-label">Rol</label>
          <select id="rol" class="form-select">
            <option value="1">Usuario</option>
            <option value="2">Editor</option>
            <option value="3">Admin</option>
          </select>
        </div>
        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" id="activo">
          <label class="form-check-label" for="activo">Activo</label>
        </div>
        <button type="submit" class="btn btn-registrar w-100 mt-4">Guardar</button>
      </form>
    </div>
  </div>
  <section id="footer"></section>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/apiConfig.js"></script>
  <script src="../js/editarUsuario.js"></script>
</body>
</html>
