<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dirección de Envío</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/Style.css">
  <link rel="stylesheet" href="../css/styles_carrito.css">
  <link rel="stylesheet" href="../css/components.css">
  <script src="../js/cartUtils.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/apiConfig.js"></script>
  <script defer src="../js/direccion.js"></script>
</head>
<body class="d-flex flex-column min-vh-100">
  <section class="image-background" style="--bg-url: url('../assets/img/imagenDesarrolladoresWeb.PNG')">
    <section id="navbar"></section>
    <main class="container py-5 flex-grow-1">
      <h2 class="text-center mb-4">Dirección de Envío</h2>
      <div class="container-custom">
        <div class="form-card position-relative">
          <div class="form-header">Información de Entrega</div>
          <select id="direccion-select" class="form-select mb-3 d-none"></select>
          <form id="shipping-form" class="custom-form">
            <div class="mb-3">
              <label class="form-label">Calle y número</label>
              <input type="text" class="form-control" name="direccion" required placeholder="Ingresa calle y número">
            </div>
            <div class="mb-3">
              <label class="form-label">Complemento</label>
              <input type="text" class="form-control" name="complemento" placeholder="Opcional">
            </div>
            <div class="mb-3">
              <label class="form-label">Código postal</label>
              <input type="text" class="form-control" name="codigo_postal" required placeholder="Ej: 44100">
            </div>
            <button type="submit" class="btn btn-confirmar d-block mx-auto mt-3">Continuar con pago</button>
          </form>
        </div>
      </div>
    </main>
  </section>
  <section id="footer"></section>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.min.js" crossorigin="anonymous"></script>
</body>
</html>
