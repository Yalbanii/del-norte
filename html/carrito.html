<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carrito de Compras</title>
  <!-- link de boostrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <!-- link de CSS-->
  <link rel="stylesheet" href="../css/Style.css">
  <link rel="stylesheet" href="../css/styles_carrito.css">
  <link rel="stylesheet" href="../css/components.css">
  <script src="../js/cartUtils.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/apiConfig.js"></script>
  <!-- ?Font awesome 6.6.0 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-..." crossorigin="anonymous" referrerpolicy="no-referrer" />
  <!-- ?AOS Animate -->
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <!-- ? Animate CSS -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

       <!-- link a JS carrito -->
  <script defer src="../js/carrito.js"></script>
     
</head>
<body class="d-flex flex-column min-vh-100">
  <section class="image-background" style="--bg-url: url('../assets/img/imagenDesarrolladoresWeb.PNG')">
    <!-- ? Sección del navbar -->
    <section id="navbar"> </section>


    <main class="container py-5 flex-grow-1">

    <!--! termina el navbar-->

    <!-- ! Desde aquí son las secciones de la página Carrito de compras -->
     
    <!--* boton provisional para la exposicion -->

<!-- Botón para agregar productos -->
<div class="text-end mb-3">
  <button id="agregar-producto" class="btn btn-success">Agregar productos</button>
</div>

    <!--!Carrito de compras  -->
    
<div class="container-custom">
<section class="mb-5">
  <h2 class="text-center mb-4 cart-title">Carrito</h2>
<hr>
  <!-- Encabezado del carrito, que ahora es responsive (desaparece en pantallas pequeñas) gracias a d-non y d-md-block -->
<div class="card p-3 mb-3 fw-bold d-none d-md-block cart-item-card form-card">
  <div class="row text-center align-items-center">

    <!-- Producto -->
    <div class="col-12 col-md-2">
      <p class="mb-0">Producto</p>
    </div>

    <!-- Descripción -->
    <div class="col-12 col-md-5">
      <p class="mb-0">Descripción</p>
    </div>

    <!-- Cantidad -->
    <div class="col-12 col-md-3">
      <p class="mb-0">Cantidad</p>
    </div>

    <!-- Subtotal -->
    <div class="col-12 col-md-2">
      <p class="mb-0">Precio</p>
    </div>

  </div>
</div>

  <!--!  Contenedor para las tarjetas de productos -->
 
  <div id="cart-items" class="d-flex flex-column gap-4">
    <!-- Tarjeta de producto de ejemplo -->
    <div class="card p-3 cart-item-card form-card">
      <div class="row align-items-center">

        <!-- Imagen del producto -->
        <div class="col-12 col-md-2 text-center">
          <img src="assets/productos/Birria.avif" alt="Birria" class="img-fluid rounded" style="max-height: 100px;">
        </div>

        <!-- Descripcion-->
        <div class="col-12 col-md-5 mt-3 mt-md-0">
          <h6 class="mb-1">Nombre del producto</h6>
          <p class="mb-1 text-muted">Descripción del producto.</p>
          
        </div>

        <!-- Cantidad -->
        <div class="col-12 col-md-3 text-center mt-3 mt-md-0">
          <div class="input-group justify-content-center">
            <button class="btn btn-outline-secondary">-</button>
            <input type="text" class="form-control text-center" value="1" style="max-width: 60px;">
            <button class="btn btn-outline-secondary">+</button>
          </div>
          <button class="btn btn-link text-danger mt-2">Quitar</button>
        </div>

        <!-- Total por item -->
        <div class="col-12 col-md-2 text-center mt-3 mt-md-0">
          <p class="fw-bold">$150.00</p>
        </div>

      </div>
    </div>

  </div>

  <!-- Totales -->
  <div class="text-end mt-4 cart-totals">
    <h5>Subtotal: <span id="cart-subtotal" class="fw-bold">$0.00</span></h5>
    <h5>Envío: <span id="cart-envio" class="fw-bold">$0.00</span></h5>
    <h5>Total: <span id="cart-total" class="fw-bold">$0.00</span></h5>
  </div>
</section>
</div>
</div>
<!--! Gasto estimado de envío -->
<div class="container-custom">
<section class="mb-5">
  <div class="form-card position-relative">
    <div class="form-header">Gasto estimado de envío</div>
    <form id="estimacion-envio-form" class="custom-form">
  <div class="row align-items-end">
    <div class="col-md-9 mb-3 position-relative">
      <label for="cp-estimado" class="form-label">Código Postal</label>
      <input id="cp-estimado" type="text" class="form-control" placeholder="Ingresa tu código postal" autocomplete="off">
      <div id="cp-suggestions" class="list-group position-absolute w-100" style="z-index:1000;"></div>
    </div>
    <div class="col-md-3 text-end mb-3">
      <button type="submit" class="btn btn-confirmar w-100">Obtener estimación</button>
    </div>
  </div>
  <hr />
  <p class="text-center fw-bold" id="resultado-estimacion">Costo estimado: $0.00</p>
</form>
</div>
</section>
</div>

<!-- Botón para continuar a dirección de envío -->
<div class="text-end mb-5">
  <button id="btn-comprar" class="btn btn-confirmar">Comprar</button>
</div>


<!-- Modal Agregar Productos -->
<div class="modal fade" id="modal-agregar-producto" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-scrollable modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Agregar productos</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="d-flex mb-3 gap-2">
          <input type="search" id="buscar-producto" class="form-control" placeholder="Buscar">
          <select id="filtrar-categoria" class="form-select" style="max-width:150px;">
            <option value="">Todos</option>
            <option value="1">Cordero</option>
            <option value="2">Res</option>
            <option value="3">Procesados</option>
          </select>
        </div>
        <div id="lista-productos" class="row row-cols-1 row-cols-md-2 g-3"></div>
      </div>
    </div>
  </div>
</div>
<!-- Modal Seleccionar Cantidad -->
<div class="modal fade" id="modal-cantidad-producto" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Seleccionar cantidad</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body text-center">
        <h6 id="cantidad-producto-nombre" class="mb-3"></h6>
        <div class="mb-3">
          <input type="number" id="cantidad-producto-input" class="form-control" min="1" value="1">
          <div id="cantidad-producto-stock" class="form-text"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" id="cantidad-producto-confirmar">Agregar</button>
      </div>
    </div>
  </div>
</div>
<br>
</main>
  </section>
<!-- ! Sección del footer -->
    <section id="footer"> </section>

<!-- otros scripts -->
 
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.min.js"
      integrity="sha384-RuyvpeZCxMJCqVUGFI0Do1mQrods/hhxYlcVfGPOfQtPJh0JCw12tUAZ/Mv10S7D"
      crossorigin="anonymous"></script>
    <script src="../js/agregarProductos.js"></script>
  </body>
</html>
