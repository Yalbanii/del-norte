<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seguridad</title>
  <!-- Fuente Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet" />

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Estilos personalizados -->
  <link rel="stylesheet" href="/css/stylesAjustesUsuario.css" />
  <link rel="icon" sizes="64x64" href="/assets/img/2.png" />
  <link rel="stylesheet" href="/css/Style.css" />
  <link rel="stylesheet" href="../../css/components.css">
  <script src="../../js/components.js"></script>
  <!-- ?Font awesome 6.6.0 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-..." crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
  <section class="image-background" style="--bg-url: url('/assets/img/imagenAjustesUsuario.PNG')">
    <section id="navbar"></section>
    <main class="container py-5 flex-grow-1">
      <div class="row justify-content-center">
        <div class="col-md-8">
          <div class="form-card">
            <div class="form-header">Seguridad</div>
            <h3 class="text-center mb-3">Cambiar contraseña</h3>
            <form id="form-pass" class="custom-form">
              <div class="mb-3">
                <input type="password" class="form-control" id="new-pass" placeholder="Nueva contraseña" required>
              </div>
              <button class="btn btn-danger w-100" type="submit">Actualizar</button>
            </form>
          </div>
        </div>
      </div>
    </main>
  </section>
  <section id="footer"></section>
  <script src="../../js/seguridad.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.min.js" integrity="sha384-RuyvpeZCxMJCqVUGFI0Do1mQrods/hhxYlcVfGPOfQtPJh0JCw12tUAZ/Mv10S7D" crossorigin="anonymous"></script>

</html>
